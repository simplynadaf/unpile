name: Deploy static preview to GitHub Pages

# The web/ folder is a static preview that serves pre-computed, real TabPFN-v2 + Gemma
# results (web/static-data.json). The live models run locally via `python run.py`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site (banner for OG image + optional custom domain)
        run: |
          cp docs/banner.png web/banner.png || true
          # Drop a CNAME into the published site if a custom domain is set at repo root
          # (e.g. echo unpile.tech > CNAME). No-op until you register one.
          if [ -f CNAME ]; then cp CNAME web/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
